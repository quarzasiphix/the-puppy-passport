# Cloudflare config, version-controlled so the deploy has an explicit source of truth for the
# worker name, compat date, and the nodejs_compat flag SSR needs.
#
# Keep ONLY fields valid for BOTH nitro cloudflare targets. The build picks the target from the
# environment: `cloudflare-module` locally (.output/, emits its own `main` + ASSETS binding) and
# `cloudflare-pages` on Cloudflare (dist/_worker.js, emits `pages_build_output_dir`). nitro merges
# THIS file over its generated config (defu in _presets.mjs writeWranglerConfig), so anything set
# here that only fits one target leaks into the other — e.g. an `[assets] binding = "ASSETS"` here
# breaks the Pages build because "ASSETS" is a reserved binding name in Pages projects. Do not add
# `main`, `[assets]`, or `pages_build_output_dir` here; let the preset supply those.
#
# [vars] are RUNTIME bindings only. The app reads Supabase config via `import.meta.env.VITE_*`,
# which Vite inlines at BUILD time — the values that make the app boot live in `.env.production`
# (committed). These are kept for any runtime `env.VITE_*` lookup.

name = "the-puppy-passport"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

