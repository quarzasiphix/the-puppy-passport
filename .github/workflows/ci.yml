name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Install, typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Supabase's version tracking key is only the numeric timestamp prefix of a migration
      # filename, not the full filename — two files sharing a prefix pass a plain `ls` review but
      # fail `supabase db reset` with a duplicate-key error (found and hit for real during the
      # Stage J-era transport-domain-hardening pass, when a concurrent process independently added
      # a migration with the same prefix this session had already used). Catching it here is cheap
      # and fails fast, before a slower Docker-dependent job would eventually hit the same error.
      - name: Check for duplicate migration version prefixes
        run: |
          dupes=$(ls supabase/migrations/*.sql | sed -E 's#.*/([0-9]+)_.*#\1#' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration version prefix(es) found — Supabase tracks only the numeric" >&2
            echo "prefix, not the full filename, so these will collide on 'supabase db reset':" >&2
            echo "$dupes" >&2
            exit 1
          fi

      # Stage CA: static, offline scan for the concrete unsafe-migration patterns this session has
      # actually hit (a table with RLS but no matching GRANT anywhere, a NOT NULL column added with
      # no DEFAULT, an enum value added and used in the same file, a bare destructive drop) — turns
      # Stage AL's one-time manual audit into a check every future migration passes through
      # automatically. Needs no Docker/database, so it runs here in the fast job.
      - name: Migration preflight (unsafe-pattern scan)
        run: npm run db:preflight

      - name: Build
        run: npm run build
        env:
          # A real VITE_SUPABASE_URL/ANON_KEY is not required for `vite build` to succeed (the
          # client throws at *runtime* construction, not at build time — see
          # src/lib/supabase/browser.ts/server.ts) — confirmed by this exact CI build succeeding
          # without them. Left unset deliberately: CI has no local Supabase stack to point at, and
          # a real project's anon key is not a secret worth wiring into every PR build.
          CI: true

      # routeTree.gen.ts is generated by the build/dev server from src/routes/*.tsx and is
      # committed (per CLAUDE.md: "never hand-edit it; it regenerates when the dev server or a
      # build runs") — this catches a route file added/changed without the regenerated tree also
      # being committed, which would otherwise only surface as a confusing runtime routing bug.
      - name: Route tree is up to date and committed
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "src/routeTree.gen.ts is out of date — 'npm run build' regenerated it from the" >&2
            echo "current src/routes/*.tsx, but the committed version doesn't match. Run the build" >&2
            echo "locally and commit the result." >&2
            git diff --stat -- src/routeTree.gen.ts >&2
            exit 1
          fi

  # Separate, independent job — this one needs Docker (for the local Supabase stack) and takes
  # longer, so it must never block or fail the basic install/typecheck/lint/build job above if
  # Docker/Supabase isn't available in a given runner. See docs/DATABASE_TESTING.md.
  #
  # The four "open findings" this suite once tracked (docs/DATABASE_TESTING.md) were all fixed in
  # migrations 20260101006000-20260101006300 — this job is expected to be green. If it goes red,
  # that's a real regression, not the suite doing its job.
  database-tests:
    name: Database/API regression suite (requires Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (runs every migration, then supabase/seed.sql)
        run: supabase start

      - name: Export local Supabase URL/anon key for the test suite
        run: supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed 's/^API_URL=/SUPABASE_URL=/; s/^ANON_KEY=/SUPABASE_ANON_KEY=/' >> "$GITHUB_ENV"

      - name: Run the database/API regression suite
        run: npm run test:db

      # The suite is designed to be safely re-runnable against the same already-seeded database
      # without a reset (see docs/DATABASE_TESTING.md's cleanup-and-repeatability discipline) — a
      # test that only passes once (leftover rows, an exhausted unique constraint, a rate-limit
      # counter never reset) is a real bug, not a flake, and this catches it in CI the same way
      # every local session in this repo already verifies it manually before every commit.
      - name: Run the suite again without resetting (repeatability check)
        run: npm run test:db
