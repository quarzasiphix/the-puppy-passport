name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Install, typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # No automated test suite exists yet (see docs/PRODUCTION_READINESS_REPORT.md — "no
      # automated tests anywhere"). Add a `test` step here once one exists rather than adding a
      # placeholder step now that would report green without checking anything real.

      - name: Build
        run: npm run build
        env:
          # A real VITE_SUPABASE_URL/ANON_KEY is not required for `vite build` to succeed (the
          # client throws at *runtime* construction, not at build time — see
          # src/lib/supabase/browser.ts/server.ts) — confirmed by this exact CI build succeeding
          # without them. Left unset deliberately: CI has no local Supabase stack to point at, and
          # a real project's anon key is not a secret worth wiring into every PR build.
          CI: true

  # Separate, independent job — this one needs Docker (for the local Supabase stack) and takes
  # longer, so it must never block or fail the basic install/typecheck/lint/build job above if
  # Docker/Supabase isn't available in a given runner. See docs/DATABASE_TESTING.md.
  #
  # The four "open findings" this suite once tracked (docs/DATABASE_TESTING.md) were all fixed in
  # migrations 20260101006000-20260101006300 — this job is expected to be green. If it goes red,
  # that's a real regression, not the suite doing its job.
  database-tests:
    name: Database/API regression suite (requires Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (runs every migration, then supabase/seed.sql)
        run: supabase start

      - name: Export local Supabase URL/anon key for the test suite
        run: supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed 's/^API_URL=/SUPABASE_URL=/; s/^ANON_KEY=/SUPABASE_ANON_KEY=/' >> "$GITHUB_ENV"

      - name: Run the database/API regression suite
        run: npm run test:db
